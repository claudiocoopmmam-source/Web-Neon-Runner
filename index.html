<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-wrapper">
        
        <div id="main-menu">
            <div id="menu-buttons-container">
                <button id="btn-run" class="menu-btn">CORRER</button>
                <button id="btn-highscore" class="menu-btn">HIGHSCORE</button>
            </div>
        </div>

        <div id="game-screen" style="display: none;">
            <div id="game-ui">
                <div id="lives">HP: ❤️❤️❤️</div>
                <div id="score">Score: 0</div>
            </div>
            
            <div id="canvas-container" style="position: relative; width: 800px; height: 400px;">
                <canvas id="gameCanvas" width="800" height="400"></canvas>
                
                <div id="game-over-screen" style="display: none;">
                    <h2>GAME OVER</h2>
                    <p id="game-over-tip" style="color: #626a8a; font-size: 1rem; text-align: center; max-width: 500px; line-height: 1.4; font-style: italic;"></p>
                    <div id="game-over-buttons">
                        <button id="btn-restart" class="menu-btn">RECOMEÇAR</button>
                        <button id="btn-to-menu" class="menu-btn">MENU</button>
                    </div>
                </div>
            </div>

            <div id="controls-tip">
                [W / Espaço / ↑] Pula (Aperte 3x e segure para VOAR)<br>
                [D / X / → / Clique] Ataque Melee | [P] Pausa
            </div>
        </div>

    </div>

    <script src="game.js"></script>
    <script src="menu.js"></script>
</body>
</html>
