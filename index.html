<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-wrapper">
        <div id="audio-unlocker">
            <div class="unlock-text">CLIQUE EM QUALQUER LUGAR PARA INICIAR</div>
        </div>

        <div id="main-menu">
            <div id="menu-buttons-container">
                <button id="btn-run" class="menu-btn">CORRER</button>
                <button id="btn-options" class="menu-btn">OPÇÕES</button>
                <button id="btn-highscore" class="menu-btn">HIGHSCORE</button>
            </div>
        </div>

        <div id="subtitles-container"></div>

        <div id="options-menu" style="display: none;">
            <h2>OPÇÕES</h2>
            
            <div class="option-row">
                <label>MÚSICA (BGM)</label>
                <div class="slider-container">
                    <img id="icon-bgm" src="assets/ui/sound_on.webp" alt="Música">
                    <input type="range" id="slider-bgm" min="0" max="1" step="0.05" value="0.15">
                </div>
            </div>

            <div class="option-row">
                <label>EFEITOS (SFX)</label>
                <div class="slider-container">
                    <img id="icon-sfx" src="assets/ui/sound_on.webp" alt="SFX">
                    <input type="range" id="slider-sfx" min="0" max="1" step="0.05" value="0.50">
                </div>
            </div>

            <button id="btn-close-options" class="menu-btn">VOLTAR</button>
        </div>

        <div id="game-screen" style="display: none;">
            <div id="game-ui">
                <div id="lives">HP: ❤️❤️❤️</div>
                <div id="score">Score: 0</div>
            </div>
            
            <div id="canvas-container" style="position: relative; width: 1024px; height: 576px;">
                <canvas id="gameCanvas" width="1024" height="576"></canvas>
                
                <div id="pause-screen" style="display: none;">
                    <h2>PAUSADO</h2>
                    <div id="pause-buttons">
                        <button id="btn-resume" class="menu-btn">RETOMAR</button>
                        <button id="btn-pause-options" class="menu-btn">OPÇÕES</button>
                        <button id="btn-pause-to-menu" class="menu-btn">MENU</button>
                    </div>
                </div>

                <div id="game-over-screen" style="display: none;">
                    <h2>GAME OVER</h2>
                    <p id="game-over-tip" style="color: #626a8a; font-size: 1rem; text-align: center; max-width: 500px; line-height: 1.4; font-style: italic;"></p>
                    <div id="game-over-buttons">
                        <button id="btn-restart" class="menu-btn">RECOMEÇAR</button>
                        <button id="btn-to-menu" class="menu-btn">MENU</button>
                    </div>
                </div>
            </div>

            <div id="controls-tip">
                [W / Espaço / ↑] Pula (Aperte 3x e segure para VOAR)<br>
                [D / X / → / Clique] Ataque Melee | [P] Pausa
            </div>
        </div>
    </div> <script type="module" src="game.js"></script>
</body>
</html>
