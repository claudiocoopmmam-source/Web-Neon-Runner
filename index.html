<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-wrapper">
        <button id="btn-mute" title="Mutar/Desmutar áudio" style="position: absolute; top: 20px; right: 20px; z-index: 100; background: transparent; border: none; cursor: pointer; padding: 0; outline: none; width: 44px; height: 32px;">
            <img id="mute-icon" src="assets/ui/sound_on.webp" alt="Volume" style="width: 100%; height: 100%; display: block;">
        </button>

        <div id="main-menu">
            <div id="menu-buttons-container">
                <button id="btn-run" class="menu-btn">CORRER</button>
                <button id="btn-highscore" class="menu-btn">HIGHSCORE</button>
            </div>
        </div>

        <div id="game-screen" style="display: none;">
            <div id="game-ui">
                <div id="lives">HP: ❤️❤️❤️</div>
                <div id="score">Score: 0</div>
            </div>
            
            <div id="canvas-container" style="position: relative; width: 1024px; height: 576px;">
                <canvas id="gameCanvas" width="1024" height="576"></canvas>
                
                <div id="game-over-screen" style="display: none;">
                    <h2>GAME OVER</h2>
                    <p id="game-over-tip" style="color: #626a8a; font-size: 1rem; text-align: center; max-width: 500px; line-height: 1.4; font-style: italic;"></p>
                    <div id="game-over-buttons">
                        <button id="btn-restart" class="menu-btn">RECOMEÇAR</button>
                        <button id="btn-to-menu" class="menu-btn">MENU</button>
                    </div>
                </div>
            </div>

            <div id="controls-tip">
                [W / Espaço / ↑] Pula (Aperte 3x e segure para VOAR)<br>
                [D / X / → / Clique] Ataque Melee | [P] Pausa
            </div>
        </div>

    <script type="module" src="game.js"></script>
</body>
</html>
